services:
  - type: web
    name: reachinbox-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm run start & npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
