services:
  # The Node.js Express API
  - type: web
    name: reachinbox-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: WORKER_CONCURRENCY
        value: "10"
      - key: MIN_EMAIL_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "200"
      # You will need to manually set these in the Render dashboard after creation:
      # - SESSION_SECRET
      # - GOOGLE_CLIENT_ID
      # - GOOGLE_CLIENT_SECRET
      # - GOOGLE_CALLBACK_URL (e.g. https://reachinbox-api.onrender.com/api/auth/google/callback)
      # - SLACK_CLIENT_ID
      # - SLACK_CLIENT_SECRET
      # - SLACK_REDIRECT_URI
      # - ENCRYPTION_KEY
      # - FRONTEND_URL (e.g. https://your-vercel-app.vercel.app)

  # The Background BullMQ Worker
  - type: worker
    name: reachinbox-worker
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: ENCRYPTION_KEY
        sync: false # Must be identical to the API's encryption key

  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: [] # only allow internal connections

databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
    plan: free
